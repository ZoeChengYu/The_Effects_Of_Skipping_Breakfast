            position: relative;
        }

        .ambient-orb {

            z-index: -1;

            animation: float 20s infinite ease-in-out alternate;
        }
        
        .orb-1 {

            height: 400px;
            background: rgba(56, 189, 248, 0.3);
            top: -100px;
            left: -100px;
        }
        
        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(129, 140, 248, 0.2);
            bottom: -200px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        .container {

        }

        header {

            margin-bottom: 4rem;
        }

        h1 {

            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.125rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .controls {

            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

            backdrop-filter: blur(10px);

            font-family: inherit;
        }

        .search-box:focus {

            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.25rem;
            padding: 1.5rem;
            backdrop-filter: blur(12px);

            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;

            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));

            transition: opacity 0.3s ease;

            opacity: 1;
        }

            justify-content: space-between;
            align-items: flex-start;
        }

        .food-name {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;

            font-weight: 600;
            font-size: 0.875rem;

            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);

            letter-spacing: 0.05em;

        .stat-value.fat { color: var(--accent-danger); }

            align-items: center;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;

        .fat-ratio-value { font-weight: 600; color: var(--accent-danger); }

            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
            font-size: 1.125rem;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            padding-bottom: 2rem;
            position: relative;
            z-index: 10;
        }

        .github-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);

        const grid = document.getElementById('grid');
        const searchInput = document.getElementById('searchInput');

        function createCard(item) {
            const maxProtein = 30;
            const maxCarbs = 100;
            const maxFat = 50;

            const proteinPct = item.protein ? Math.min((item.protein / maxProtein) * 100, 100) : 0;
            const carbsPct = item.carbs ? Math.min((item.carbs / maxCarbs) * 100, 100) : 0;
            const fatPct = item.fat ? Math.min((item.fat / maxFat) * 100, 100) : 0;
            
            const fatRatioColor = item.fatRatio > 35 ? "var(--accent-danger)" : (item.fatRatio > 20 ? "var(--accent-warning)" : "var(--accent-success)");

            let weightHtml = item.weight ? `<div class="stat"><span class="stat-label">重量</span><span class="stat-value weight">${item.weight}g</span></div>` : "";
            let priceHtml = item.price ? `<div class="stat"><span class="stat-label">價格</span><span class="stat-value" style="color: var(--accent-primary)">$${item.price}</span></div>` : "";
            let allergensHtml = item.allergens ? `<div style="font-size: 0.75rem; color: var(--accent-warning); margin-top: 0.5rem;">⚠️ 過敏原: ${item.allergens}</div>` : "";

            return `
                <div class="card">
                    <div class="card-header" style="flex-direction: column; gap: 0.5rem;">
                        <div style="display: flex; justify-content: space-between; width: 100%; align-items: flex-start;">
                            <h2 class="food-name">${item.name}</h2>
                            <span class="calories-badge">${item.calories ? item.calories + " 大卡" : "未知"}</span>
                        </div>
                        <span style="font-size: 0.8rem; color: var(--accent-secondary); padding: 0.2rem 0.6rem; background: rgba(129, 140, 248, 0.1); border-radius: 4px;">${item.category}</span>
                    </div>
                    
                    <div class="nutrition-grid">
                        ${weightHtml}
                        ${priceHtml}
                        <div class="stat">
                            <span class="stat-label">蛋白質</span>
                            <span class="stat-value protein">${item.protein || "-"}g</span>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${proteinPct}%; background: var(--accent-primary)"></div>
                            </div>
                        </div>
                        <div class="stat">
                            <span class="stat-label">碳水/醣類</span>
                            <span class="stat-value carbs">${item.carbs || "-"}g</span>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${carbsPct}%; background: var(--accent-success)"></div>
                            </div>
                        </div>
                        <div class="stat">
                            <span class="stat-label">脂肪</span>
                            <span class="stat-value fat">${item.fat || "-"}g</span>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${fatPct}%; background: var(--accent-danger)"></div>
                            </div>
                        </div>
                    </div>
                    ${allergensHtml}
                    <div class="fat-ratio-container">
                        <div class="fat-ratio-header">
                            <span class="fat-ratio-label">脂肪佔熱量比</span>
                            <span class="fat-ratio-value" style="color: ${fatRatioColor}">${item.fatRatio ? item.fatRatio + "%" : "-"}</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${item.fatRatio || 0}%; background: ${fatRatioColor}"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGrid(items) {
            if (items.length === 0) {
                grid.innerHTML = '<div class="empty-state">找不到符合的早餐品項，請嘗試其他關鍵字。</div>';
                return;
            }
            grid.innerHTML = items.map(createCard).join('');
            
            // Trigger reflow for animations
            requestAnimationFrame(() => {
                const fills = document.querySelectorAll('.progress-bar-fill');
                fills.forEach(fill => {
                    const width = fill.style.width;
                    fill.style.width = '0%';
                    setTimeout(() => {
                        fill.style.width = width;
                    }, 50);
                });
            });
        }

        // Initial render
        renderGrid(data);

        // Search functionality
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = data.filter(item => 
                item.name.toLowerCase().includes(term)
            );
            renderGrid(filtered);
        });
    </script>
